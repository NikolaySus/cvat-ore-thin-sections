name: ore-cvat
services:
  cvat_ui:
    container_name: ore-cvat-ui
    image: ore-cvat-ui:v2.77.0
    build:
      context: ./vendor/cvat
      dockerfile: Dockerfile.ui
      args:
        CLIENT_PLUGINS: plugins/ore
  ore_service:
    build: ./server
    image: ore-cvat-service:local
    restart: unless-stopped
    init: true
    environment:
      CVAT_URL: http://cvat-server:8080
      JOB_TIMEOUT: 900
    volumes:
      - ./data/ore:/data
    networks:
      - cvat
    labels:
      traefik.enable: 'true'
      traefik.http.services.ore.loadbalancer.server.port: '8090'
      traefik.http.routers.ore.rule: Host(`localhost`) && PathPrefix(`/ore/`)
      traefik.http.routers.ore.priority: '100'
      traefik.http.routers.ore.entrypoints: web
  traefik:
    container_name: ore-cvat-proxy
    ports: !override
      - 127.0.0.1:8080:8080
    environment:
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: ore-cvat
  cvat_server:
    container_name: ore-cvat-server
    environment:
      CVAT_HEALTH_DISK_USAGE_MAX: 97
  cvat_db:
    container_name: ore-cvat-db
  cvat_redis_inmem:
    container_name: ore-cvat-redis
  cvat_redis_ondisk:
    container_name: ore-cvat-cache
  cvat_worker_utils:
    container_name: ore-cvat-utils
  cvat_worker_import:
    container_name: ore-cvat-import
  cvat_worker_export:
    container_name: ore-cvat-export
  cvat_worker_annotation:
    container_name: ore-cvat-annotation
  cvat_worker_webhooks:
    container_name: ore-cvat-webhooks
  cvat_worker_quality_reports:
    container_name: ore-cvat-quality
  cvat_worker_chunks:
    container_name: ore-cvat-chunks
  cvat_worker_consensus:
    container_name: ore-cvat-consensus
  cvat_opa:
    container_name: ore-cvat-opa
  cvat_clickhouse:
    container_name: ore-cvat-clickhouse
  cvat_vector:
    container_name: ore-cvat-vector
  cvat_grafana:
    container_name: ore-cvat-grafana
networks:
  cvat:
    name: ore-cvat
    ipam:
      config:
        - subnet: 172.30.90.0/24
